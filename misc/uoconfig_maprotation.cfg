// CoDUOMP server sample map rotation config file. Make this file your own.
//
// Optional include file. Add "exec uoconfig_maprotation.cfg" to a server config
// to use these rotations.
//
// sv_mapRotation is a token list the engine walks at the end of every match
// through map_rotate:
//
//   gametype  <gametype>                     change the mode for the next maps
//   allow_jeeps  <0|1>                       enable or disable jeeps
//   allow_tanks  <0|1>                       enable or disable tanks
//   exec  <cfg>                              execute a config file
//   map  <mapname>                           load the map
//
// Keep only the rotation you want active; the others are ready to swap in.
// Every map below ships with Call of Duty and United Offensive.

set sv_mapRotationCurrent ""

// Deathmatch
//set sv_mapRotation "gametype dm map mp_carentan map mp_dawnville map mp_harbor map mp_bocage map mp_brecourt map mp_chateau map mp_depot map mp_hurtgen map mp_neuville map mp_pavlov map mp_powcamp map mp_railyard map mp_rocket map mp_ship map mp_stalingrad map mp_arnhem map mp_berlin map mp_cassino map mp_foy map mp_italy map mp_kharkov map mp_kursk map mp_ponyri map mp_rhinevalley map mp_sicily map mp_uo_stanjel"

