// CoDUOMP example server config file. Make this file your own.
//
// Put the file in uo/ below fs_homepath (default ~/.callofduty) or fs_basepath.
// Add
//
//   exec uoconfig_example_bel.cfg
//
// to uo/autoexec_mp.cfg, then start the server with:
//
//   coduo_lnxded_recovered
//   coduo_dedicated_recovered.exe
//
// Starting with "+exec uoconfig_example_bel.cfg" also works, but then pass the
// network settings as "+set net_ip 0.0.0.0 +set net_port 28960" instead.
//
// Only cvars that this engine and game module accept are listed here.
//
// Color codes: ^1 red ^2 green ^3 yellow ^4 blue ^5 light blue ^6 purple
//              ^7 white ^8 mission ^9 grey ^0 black

// HOSTNAME & MOTD

set sv_hostname              "^2OpenCoDUO^7 Server - ^3BEL"  // server name shown in the browser, color codes allowed
set g_motd                   "Welcome on OpenCoDUO Server"  // join-screen message, color codes allowed


// CLIENTS

set sv_maxclients            "32"           // player slots, 1..64, latched
set sv_privateClients        "12"           // slots reserved for sv_privatePassword, 0..sv_maxclients
set sv_privatePassword       ""             // password for the reserved slots, empty: no password


// PASSWORDS

set g_password               ""             // server password, empty: public server
set rconPassword             ""             // remote console password, set a strong one before going public


// NETWORK

// net_ip, net_port and net_noudp are read before the engine opens its socket.
// They apply when this file is executed from autoexec_mp.cfg, or as "+set"
// values on the command line. A bare "+exec" runs after the socket opens.
set net_ip                   "0.0.0.0"      // bind address, 0.0.0.0: every IPv4 interface
set net_port                 "28960"        // UDP game port, the next free port is tried when busy

// dedicated is read-only once the engine is running; pass "+set dedicated 1"
// on the command line for a LAN-only server. The dedicated engine uses 2.
set sv_timeout               "40"           // seconds without reliable data before a client is timed out
set sv_zombietime            "2"            // seconds a timed-out client stays listed
set sv_minPing               "0"            // minimum ping in milliseconds, 0: no minimum
set sv_maxPing               "0"            // maximum ping in milliseconds, 0: no maximum
set sv_fps                   "40"           // snapshots per second, stock 20


// DOWNLOAD

set sv_maxRate               "25000"        // bytes per second per client, 0: unlimited, also caps downloads
set sv_allowDownload         "1"            // 0: no downloads from this server 1: allow them
// HTTP download example: with sv_wwwDownload 1 and
//   set sv_wwwBaseURL "https://files.example.net/uo"
// a client that needs pakuo00.pk3 is sent to
//   https://files.example.net/uo/pakuo00.pk3
// The URL must not end with "/" (the engine inserts it), and the HTTP host
// must mirror the game directory so every requested path exists.
set sv_wwwDownload           "0"            // 0: serve downloads here 1: redirect to sv_wwwBaseURL
set sv_wwwBaseURL            ""             // base URL for sv_wwwDownload, for example "https://files.example.net/uo"
set sv_wwwDlDisconnected     "0"            // 0: stay connected while downloading 1: download after disconnect


// LOGGING & PROTECTION

// Security note: once the console log is enabled, every later cvar set is
// written to it as "cvar set <name> <value>". Set passwords before this line,
// or keep them in a separate 600 config that is executed first.
set logfile                  "0"            // console log: 0 off 1 on buffered 2 on unbuffered; console_mp_server.log is truncated each start
set g_log                    ""             // game log file, empty: off; appends across starts, for example "games_mp.log"
set g_logSync                "0"            // game log writes: 0 buffered 1 flush every write
set sv_pure                  "1"            // 0: accept any PK3 1: verify PK3 checksums
set sv_floodProtect          "1"            // 0: off 1: throttle command floods
set sv_reconnectlimit        "3"            // seconds before the same client may reconnect
set sv_kickBanTime           "300"          // seconds a kicked GUID stays banned, 0: no ban
set g_banIPs                 ""             // space separated banned addresses, empty: none
// The default build sets CODUO_DISABLE_SERVER_AUTH=1, which skips external
// CD-key authorization; any client then joins without a key. These two cvars
// only apply to a server built with AUTH=1.
set sv_allowAnonymous        "1"            // 0: require a CD key 1: ask the auth service to accept clients without one
set net_lanauthorize         "0"            // 0: LAN clients skip CD-key authorization (stock) 1: LAN clients are authorized too
set sv_keywords              ""             // optional server browser keywords, empty: none
set sv_disableClientConsole  "0"            // 0: clients may open the console 1: deny console access


// GAME TYPE & RULES

set g_gametype               "bel"          // dm tdm sd re bel hq bas ctf dom, latched
set scr_battlerank           "1"            // 0: ranks off 1: ranks on
set scr_death_wait_time      "5"            // CTF respawn delay in seconds, also killcam length minus one, 0: immediate
set scr_drophealth           "1"            // 0: no health packs 1: fragged players drop a health pack
set scr_shellshock           "1"            // 0: off 1: shell-shock from grenades and rockets
set scr_teambalance          "2"            // max player difference before teams are balanced, 0: off, checks every 60 seconds
set scr_friendlyfire         "3"            // 0: off 1: on 2: reflect damage 3: share damage
set scr_forcerespawn         "3"            // DM/TDM/BEL: seconds before an automatic respawn, 0: respawn by hand (default: 3)
set scr_drawfriend           "0"            // 0: off 1: draw team icons over teammates
set g_deadChat               "0"            // 0: fragged players cannot chat 1: they can chat
set sv_obituary              "1"            // 0: no obituary messages 1: send them
set g_voiceChatsAllowed      "4"            // voice chats per player in 30 seconds
set g_complaintlimit         "3"            // complaints needed to remove a player, 0: remove on the first complaint
set g_inactivity             "60"           // seconds before an inactive player is dropped, 0: off
set g_inactivityspectator    "600"          // seconds before an inactive spectator is dropped, 0: off


// SPECTATORS

set scr_killcam              "1"            // 0: off 1: allow the killcam
set scr_freelook             "1"            // 0: off 1: allow free-look spectators
set scr_spectateenemy        "0"            // 0: teammates only 1: allow spectating the other team


// VOTING

set g_allowVote              "1"            // 0: callvote off 1: on
set g_allowVoteMap           "1"            // 0: off 1: allow callvote map <mapname>
set g_allowVoteMapRestart    "1"            // 0: off 1: allow callvote map_restart
set g_allowVoteMapRotate     "1"            // 0: off 1: allow callvote map_rotate
set g_allowVoteTypeMap       "1"            // 0: off 1: allow callvote typemap <gametype> <mapname>
set g_allowVoteGameType      "0"            // 0: off (single-mode server) 1: allow callvote g_gametype <gametype>
set g_allowVoteKick          "1"            // 0: off 1: allow callvote kick <player>
set g_allowVoteClientKick    "1"            // 0: off 1: allow callvote clientkick <clientnum>
set g_allowVoteTempBanUser   "0"            // 0: off 1: allow callvote tempBanUser <player>
set g_allowVoteTempBanClient "0"            // 0: off 1: allow callvote tempBanClient <clientnum>
set g_allowVoteDrawFriend    "0"            // 0: off 1: allow callvote drawfriend <value>
set g_allowVoteKillCam       "0"            // 0: off 1: allow callvote killcam <value>
set g_allowVoteFriendlyFire  "1"            // 0: off 1: allow callvote friendlyfire <value>
// Vote gametype allowlist for callvote typemap <gametype> <map> and
// callvote g_gametype <gametype>. Space-separated script names, matched
// case-insensitively and exactly; empty allows every gametype. It does not
// affect map, map_restart or map_rotate votes, does not enable either vote
// path, and does not restrict admin/rcon commands. On a single-gametype
// server, set it to that type to allow map changes but not gametype changes.
// dm Deathmatch, tdm Team Deathmatch, sd Search and Destroy, re Retrieval,
// bel Behind Enemy Lines, hq Headquarters, bas Base Assault, ctf Capture the
// Flag, dom Domination.
set g_voteGameTypes          "bel"          // improved: only BEL is allowed in type votes


// BEHIND ENEMY LINES

set scr_bel_scorelimit       "50"           // score needed to end the map, 0: no limit
set scr_bel_timelimit        "30"           // minutes per map, 0: no limit, maximum 1440
set scr_bel_alivepointtime   "10"           // seconds between points for staying alive


// PHYSICS

set pmove_fixed              "1"            // 0: physics follows the client frame rate (engine default) 1: fixed step from pmove_msec (non-default, removes FPS-dependent movement)
set pmove_msec               "8"            // fixed step in milliseconds at pmove_fixed 1, clamped to 8..33; 8 emulates 125 FPS (default: 8)


// OPTIONAL INCLUDES
//
// Uncomment to apply the modular sections on top of this configuration;
// values in them override the inline settings above. The files are in the
// parent directory, so copy them next to this file when you use them.
//exec "uoconfig_gameplay.cfg"
//exec "uoconfig_weapons.cfg"
//exec "uoconfig_physics.cfg"
//exec "uoconfig_maprotation.cfg"


// MAP ROTATION & FIRST MAP

// Tokens: gametype <type>, allow_jeeps 0|1, allow_tanks 0|1, exec <cfg>,
// map <mapname>. The rotation continues at the end of every match.
set sv_mapRotationCurrent    ""
set sv_mapRotation           "gametype bel map mp_carentan map mp_dawnville map mp_harbor map mp_bocage map mp_brecourt map mp_chateau map mp_depot map mp_hurtgen map mp_neuville map mp_pavlov map mp_powcamp map mp_railyard map mp_rocket map mp_ship map mp_stalingrad"

// wait 1 pauses this command buffer for one frame, so the map command runs
// after engine startup has finished. That makes the file work both with
// "+exec" and when it is executed from autoexec_mp.cfg.
wait 1; map mp_carentan // first map
