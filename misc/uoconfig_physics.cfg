// CoDUOMP server sample physics config file. Make this file your own.
//
// Optional include file. Add "exec uoconfig_physics.cfg" to a server config to
// apply this section. Each comment gives the engine default; values marked
// non-default deviate from the original game. Change them only when the server
// is meant to play differently.
// Cvars marked "before map" are cheat protected once the game module loads,
// so they only apply when this file runs before the first map.


// MOVEMENT

set g_speed                     "190"       // player movement speed in units per second (default: 190)
set g_gravity                   "800"       // gravity in units per second squared (default: 800)
set g_knockback                 "1000"      // explosion and impact knockback scale (default: 1000)
set pmove_fixed                 "1"         // 0: physics follows the client frame rate (engine default) 1: fixed step from pmove_msec (non-default, changes jump and strafe feel)
set pmove_msec                  "8"         // fixed step in milliseconds at pmove_fixed 1, clamped to 8..33; 8 emulates 125 FPS (default: 8)
set g_smoothClients             "1"         // 0: publish exact positions, no smoothing 1: extrapolate 50 ms for smoother remote players (default: 1)
set g_synchronousClients        "0"         // 0: off 1: one frame per client command, for demo recording (default: 0)
set bg_nofatigue                "0"         // 0: sprint fatigue on 1: no fatigue (default: 0)
set bg_viewheight_standing      "60"        // eye height while standing in units (default: 60)
set bg_viewheight_crouched      "40"        // eye height while crouched in units (default: 40)
set bg_viewheight_prone         "11"        // eye height while prone in units (default: 11)
set bg_ladder_yawcap            "100"       // degrees the view may turn on a ladder (default: 100)
set bg_prone_yawcap             "85"        // degrees the view may turn while prone (default: 85)
set bg_lmg_yawcap               "55"        // degrees the view may turn with a light machine gun (default: 55)
set bg_swingSpeed               "0.2"       // legs and torso swing speed, before map (default: 0.2)


// DAMAGE & BOUNDS

set bg_fallDamageMinHeight      "256"       // height where falling starts to hurt, before map (default: 256)
set bg_fallDamageMaxHeight      "480"       // height where a fall is fatal, before map (default: 480)
set g_bounds_width              "30"        // player bounds width in units, before map (default: 30)
set g_bounds_height_standing    "70"        // player bounds height in units, before map (default: 70)


// FOOTSTEP SOUNDS

set bg_foliagesnd_minspeed      "40"        // speed where foliage sounds start, units per second (default: 40)
set bg_foliagesnd_maxspeed      "180"       // speed where foliage sounds are loudest, units per second (default: 180)
set bg_foliagesnd_slowinterval  "1500"      // milliseconds between slow foliage sounds (default: 1500)
set bg_foliagesnd_fastinterval  "500"       // milliseconds between fast foliage sounds (default: 500)
set bg_foliagesnd_resetinterval "500"       // milliseconds before the interval resets (default: 500)


// VIEW BOB

set cg_bobAmplitudeStanding     "0.007"     // view bob amplitude while standing (default: 0.007)
set cg_bobAmplitudeDucked       "0.0075"    // view bob amplitude while crouched (default: 0.0075)
set cg_bobAmplitudeProne        "0.03"      // view bob amplitude while prone (default: 0.03)
set cg_bobMax                   "8"         // maximum view bob offset (default: 8)


// COLLISION

set cm_noCurves                 "0"         // 0: collide with curve models 1: ignore them (default: 0)
set cm_playerCurveClip          "1"         // 0: do not clip the player against curves 1: clip (default: 1)


// DEBUG (cheat protected, leave at 0)

//set bg_debugWeaponAnim        "0"         // 0: off 1: print weapon animation changes (default: 0)
//set bg_debugWeaponState       "0"         // 0: off 1: print weapon state changes (default: 0)
