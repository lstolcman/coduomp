// CoDUOMP server sample game config file. Make this file your own.
//
// Optional include file. Add "exec uoconfig_gameplay.cfg" to a server config
// to apply this section. Every cvar here is read by this game module or by the
// game scripts of the stock game.


// GAMEPLAY

set scr_battlerank              "1"            // 0: ranks off 1: ranks on
set scr_death_wait_time         "5"            // CTF respawn delay in seconds, also killcam length minus one, 0: immediate
set scr_drophealth              "1"            // 0: no health packs 1: fragged players drop a health pack
set scr_shellshock              "1"            // 0: off 1: shell-shock from grenades and rockets
set scr_teambalance             "0"            // max player difference before teams are balanced, 0: off, checks every 60 seconds
set sv_disableClientConsole     "0"            // 0: clients may open the console 1: deny console access
set g_deadChat                  "0"            // 0: fragged players cannot chat 1: they can chat
set scr_drawfriend              "0"            // 0: off 1: draw team icons over teammates
set scr_forcerespawn            "3"            // DM/TDM/BEL: seconds before an automatic respawn, 0: respawn by hand (default: 3)
set scr_friendlyfire            "3"            // 0: off 1: on 2: reflect damage 3: share damage
set g_intermissionDelay         "1000"         // intermission delay, stock value 1000 (milliseconds)
set g_voiceChatsAllowed         "4"            // voice chats per player in 30 seconds
set g_complaintlimit            "3"            // complaints needed to remove a player, 0: remove on the first complaint
set g_inactivity                "0"            // seconds before an inactive player is dropped, 0: off
set g_inactivityspectator       "0"            // seconds before an inactive spectator is dropped, 0: off
set sv_obituary                 "1"            // 0: no obituary messages 1: send them
set g_autodemo                  "0"            // 0: off 1: record a demo of every player
set g_autoscreenshot            "0"            // 0: off 1: screenshot every player at the end of each round
set g_no_script_spam            "0"            // 0: allow script prints 1: suppress repeated script prints


// SPECTATORS

set scr_killcam                 "1"            // 0: off 1: allow the killcam
set scr_freelook                "1"            // 0: off 1: allow free-look spectators
set scr_spectateenemy           "0"            // 0: teammates only 1: allow spectating the other team


// TIMEOUTS

set g_timeoutsallowed           "0"            // timeouts per team per match, 0: off
set g_timeoutBank               "180000"       // starting timeout budget in milliseconds
set g_timeoutlength             "90000"        // length of one timeout in milliseconds
set g_timeoutRecovery           "10000"        // milliseconds a called timeout returns to the bank


// VOTING

set g_allowVote                 "1"            // 0: callvote off 1: on
set g_allowVoteMap              "1"            // 0: off 1: allow callvote map <mapname>
set g_allowVoteMapRestart       "1"            // 0: off 1: allow callvote map_restart
set g_allowVoteMapRotate        "1"            // 0: off 1: allow callvote map_rotate
set g_allowVoteTypeMap          "1"            // 0: off 1: allow callvote typemap <gametype> <mapname>
set g_allowVoteGameType         "1"            // 0: off 1: allow callvote g_gametype <gametype>
set g_allowVoteKick             "1"            // 0: off 1: allow callvote kick <player>
set g_allowVoteClientKick       "1"            // 0: off 1: allow callvote clientkick <clientnum>
set g_allowVoteTempBanUser      "0"            // 0: off 1: allow callvote tempBanUser <player>
set g_allowVoteTempBanClient    "0"            // 0: off 1: allow callvote tempBanClient <clientnum>
set g_allowVoteDrawFriend       "0"            // 0: off 1: allow callvote drawfriend <value>
set g_allowVoteKillCam          "0"            // 0: off 1: allow callvote killcam <value>
set g_allowVoteFriendlyFire     "1"            // 0: off 1: allow callvote friendlyfire <value>
// Vote gametype allowlist for callvote typemap <gametype> <map> and
// callvote g_gametype <gametype>. Space-separated script names, matched
// case-insensitively and exactly; empty allows every gametype. It does not
// affect map, map_restart or map_rotate votes, does not enable either vote
// path, and does not restrict admin/rcon commands. On a single-gametype
// server, set it to that type to allow map changes but not gametype changes.
// dm Deathmatch, tdm Team Deathmatch, sd Search and Destroy, re Retrieval,
// bel Behind Enemy Lines, hq Headquarters, bas Base Assault, ctf Capture the
// Flag, dom Domination.
set g_voteGameTypes             ""             // space-separated allowlist; empty: all


// SCOREBOARD & TEAM DISPLAY

set g_ScoresBanner_Allies       "gfx/hud/hud@mpflag_american.tga"  // scoreboard flag image
set g_ScoresBanner_Axis         "gfx/hud/hud@mpflag_german.tga"  // scoreboard flag image
set g_ScoresBanner_None         "gfx/hud/hud@mpflag_none.tga"  // scoreboard image for no team
set g_ScoresBanner_Spectators   "gfx/hud/hud@mpflag_spectator.tga"  // scoreboard image for spectators
set g_TeamName_Allies           "GAME_ALLIES"  // team name text or localization key
set g_TeamName_Axis             "GAME_AXIS"    // team name text or localization key
set g_TeamColor_Allies          "0.5 0.5 1"    // team color as red green blue, each 0..1
set g_TeamColor_Axis            "1 0.5 0.5"    // team color as red green blue, each 0..1


// GAME TYPE SETTINGS

// Deathmatch
set scr_dm_scorelimit           "50"           // score needed to end the map, 0: no limit
set scr_dm_timelimit            "30"           // minutes per map, 0: no limit, maximum 1440

// Team deathmatch
set scr_tdm_scorelimit          "100"          // team score needed to end the map, 0: no limit
set scr_tdm_timelimit           "30"           // minutes per map, 0: no limit, maximum 1440

// Search and destroy
set scr_sd_scorelimit           "10"           // rounds won needed to end the map, 0: no limit
set scr_sd_roundlimit           "0"            // rounds per map, 0: no limit
set scr_sd_roundlength          "4"            // minutes per round, maximum 10
set scr_sd_graceperiod          "15"           // seconds at round start for spawning and weapon choice, maximum 60
set scr_sd_timelimit            "0"            // minutes per map, 0: no limit, maximum 1440

// Retrieve
set scr_re_scorelimit           "10"           // score needed to end the map, 0: no limit
set scr_re_roundlimit           "0"            // rounds per map, 0: no limit
set scr_re_roundlength          "4"            // minutes per round, maximum 10
set scr_re_graceperiod          "15"           // seconds at round start for spawning and weapon choice, maximum 60
set scr_re_showcarrier          "0"            // 0: hide carrier stars 1: show the objective carrier
set scr_re_timelimit            "0"            // minutes per map, 0: no limit, maximum 1440

// Behind enemy lines
set scr_bel_scorelimit          "50"           // score needed to end the map, 0: no limit
set scr_bel_timelimit           "30"           // minutes per map, 0: no limit, maximum 1440
set scr_bel_alivepointtime      "10"           // seconds between points for staying alive

// Headquarters
set scr_hq_scorelimit           "450"          // score needed to end the map, 0: no limit
set scr_hq_timelimit            "30"           // minutes per map, 0: no limit, maximum 1440
set scr_hqt_scorelimit          "450"          // tank headquarters: score needed to end the map, 0: no limit
set scr_hqt_timelimit           "30"           // tank headquarters: minutes per map, 0: no limit, maximum 1440

// Base assault
set scr_bas_scorelimit          "3"            // score needed to end the map, 0: no limit
set scr_bas_roundlimit          "5"            // rounds per map, 0: no limit
set scr_bas_roundlength         "30"           // minutes per round, maximum 60
set scr_bas_timelimit           "120"          // minutes per map, 0: no limit, maximum 1440
set scr_bas_clearscoreeachround "1"            // 0: keep scores 1: clear scores each round
set scr_bas_respawn_wave_time   "10"           // seconds between respawn waves, minimum 1
set scr_bas_startrounddelay     "15"           // seconds before a round starts
set scr_bas_endrounddelay       "10"           // seconds after a round ends

// Capture the flag
set scr_ctf_scorelimit          "3"            // score needed to end the map, 0: no limit
set scr_ctf_roundlimit          "5"            // rounds per map, 0: no limit
set scr_ctf_roundlength         "30"           // minutes per round, maximum 60
set scr_ctf_timelimit           "120"          // minutes per map, 0: no limit, maximum 1440
set scr_ctf_clearscoreeachround "1"            // 0: keep scores 1: clear scores each round
set scr_ctf_startrounddelay     "15"           // seconds before a round starts
set scr_ctf_endrounddelay       "10"           // seconds after a round ends

// Domination
set scr_dom_scorelimit          "3"            // score needed to end the map, 0: no limit
set scr_dom_roundlimit          "5"            // rounds per map, 0: no limit
set scr_dom_roundlength         "30"           // minutes per round, maximum 60
set scr_dom_timelimit           "120"          // minutes per map, 0: no limit, maximum 1440
set scr_dom_clearscoreeachround "1"            // 0: keep scores 1: clear scores each round
set scr_dom_respawn_wave_time   "10"           // seconds between respawn waves, minimum 1
set scr_dom_startrounddelay     "15"           // seconds before a round starts
set scr_dom_endrounddelay       "10"           // seconds after a round ends


// CHAT

set g_allowGlobalChat           "1"            // improved: 0: team and private chat only 1: allow general (say) chat
