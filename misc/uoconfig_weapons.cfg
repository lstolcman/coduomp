// CoDUOMP server sample weapon config file. Make this file your own.
//
// Optional include file. Add "exec uoconfig_weapons.cfg" to a server config to
// apply this section. The scr_allow_ cvars are read by the game scripts:
// 0 disallows the weapon or vehicle, 1 allows it.


set g_maxDroppedWeapons            "16"     // dropped weapons kept on the map, 1..32
set g_weaponAmmoPools              "0"      // 0: take partial ammo from a drop 1: leave the drop until all its ammo fits
set g_weaponrespawn                "5"      // seconds before a static weapon respawns, 0: immediately
set g_useGear                      "1"      // 0: no optional gear models 1: use them
set g_tracerchance                 "0.4"    // tracer chance for rifles and pistols, 0..1
set g_tracerchancelmg              "0.7"    // tracer chance for light machine guns, 0..1, set before the first map


// WEAPONS

set scr_allow_bar                  "1"
set scr_allow_bren                 "1"
set scr_allow_enfield              "1"
set scr_allow_fg42                 "0"      // very strong, off by default
set scr_allow_kar98k               "1"
set scr_allow_kar98ksniper         "1"
set scr_allow_m1carbine            "1"
set scr_allow_m1garand             "1"
set scr_allow_mp40                 "1"
set scr_allow_mp44                 "1"
set scr_allow_nagant               "1"
set scr_allow_nagantsniper         "1"
set scr_allow_panzerfaust          "1"
set scr_allow_ppsh                 "1"
set scr_allow_springfield          "1"
set scr_allow_sten                 "1"
set scr_allow_thompson             "1"

// United Offensive additions

set scr_allow_artillery            "1"
set scr_allow_bazooka              "1"
set scr_allow_binoculars           "1"
set scr_allow_dp28                 "1"
set scr_allow_flamethrower         "1"
set scr_allow_gewehr43             "1"
set scr_allow_grenades             "1"
set scr_allow_mg30cal              "1"
set scr_allow_mg34                 "1"
set scr_allow_panzerschreck        "1"
set scr_allow_pistols              "1"
set scr_allow_satchel              "1"
set scr_allow_smoke                "1"
set scr_allow_svt40                "1"


// VEHICLES

// scr_allow_jeeps and scr_allow_tanks are latched and can also be changed per
// map with the allow_jeeps and allow_tanks tokens in sv_mapRotation.
set scr_allow_jeeps                "1"
set scr_allow_tanks                "1"
set scr_allow_elefant              "1"
set scr_allow_flak88               "1"
set scr_allow_gaz67b               "1"
set scr_allow_horch                "1"
set scr_allow_panzeriv             "1"
set scr_allow_sherman              "1"
set scr_allow_su152                "1"
set scr_allow_t34                  "1"
set scr_allow_willyjeep            "1"


// VEHICLE BEHAVIOR

set g_vehicleHorns                 "1"      // 0: no horns 1: allow vehicle horns
set g_vehicleBurnTime              "10"     // seconds a burning vehicle stays before it explodes, latched
set g_vehicleForceBulletDamage     "0"      // 0: normal rules 1: bullets always damage vehicles
set g_vehicleForceGrenadeDamage    "0"      // 0: normal rules 1: grenades always damage vehicles
set g_vehicleEnableCollisionDamage "0"      // 0: off 1: vehicle collisions damage players
